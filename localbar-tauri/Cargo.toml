[package]
name = "localbar-tauri"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { workspace = true }
localbar-core = { path = "../localbar-core" }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
sysinfo = { workspace = true }
tokio = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", features = ["NSEvent", "block2"] }
block2 = "0.6.2"
