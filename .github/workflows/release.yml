name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create-release.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches Cargo.toml version
        run: |
          VERSION=$(grep '^version = ' localbar-tauri/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          TAG="${{ github.ref_name }}"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "ERROR: Cargo.toml version ($VERSION) does not match tag ($TAG)"
            exit 1
          fi

      - name: Create GitHub Release (draft)
        id: create-release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true

  build-macos:
    needs: create-release
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (universal)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-universal

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: localbar-tauri/ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: localbar-tauri/ui
        run: npm ci

      - name: Build frontend
        working-directory: localbar-tauri/ui
        run: npm run build

      - name: Sync tauri.conf.json version from Cargo.toml
        run: |
          VERSION=$(grep '^version = ' localbar-tauri/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          jq --arg v "$VERSION" '.version = $v' localbar-tauri/tauri.conf.json > /tmp/tauri.conf.json.tmp
          mv /tmp/tauri.conf.json.tmp localbar-tauri/tauri.conf.json

      - name: Build and bundle (macOS universal)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: localbar-tauri
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target universal-apple-darwin

  build-linux-x64:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-x64

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: localbar-tauri/ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: localbar-tauri/ui
        run: npm ci

      - name: Build frontend
        working-directory: localbar-tauri/ui
        run: npm run build

      - name: Sync tauri.conf.json version from Cargo.toml
        run: |
          VERSION=$(grep '^version = ' localbar-tauri/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          jq --arg v "$VERSION" '.version = $v' localbar-tauri/tauri.conf.json > /tmp/tauri.conf.json.tmp
          mv /tmp/tauri.conf.json.tmp localbar-tauri/tauri.conf.json

      - name: Build and bundle (Linux x86_64)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: localbar-tauri
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target x86_64-unknown-linux-gnu

  build-linux-arm64:
    needs: create-release
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-arm64

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: localbar-tauri/ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: localbar-tauri/ui
        run: npm ci

      - name: Build frontend
        working-directory: localbar-tauri/ui
        run: npm run build

      - name: Sync tauri.conf.json version from Cargo.toml
        run: |
          VERSION=$(grep '^version = ' localbar-tauri/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          jq --arg v "$VERSION" '.version = $v' localbar-tauri/tauri.conf.json > /tmp/tauri.conf.json.tmp
          mv /tmp/tauri.conf.json.tmp localbar-tauri/tauri.conf.json

      - name: Build and bundle (Linux arm64)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: localbar-tauri
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target aarch64-unknown-linux-gnu

  publish-release:
    needs: [create-release, build-macos, build-linux-x64, build-linux-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish GitHub Release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const releaseId = Number("${{ needs.create-release.outputs.release_id }}");
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              draft: false
            });
