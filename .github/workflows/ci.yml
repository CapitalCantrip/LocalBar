name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: localbar-tauri/ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: localbar-tauri/ui
        run: npm ci

      - name: Build frontend
        working-directory: localbar-tauri/ui
        run: npm run build

      - name: cargo clippy (workspace)
        run: cargo clippy --all-targets --workspace -- -D warnings

      - name: cargo test (workspace)
        run: cargo test --workspace

      - name: Build localbar binary (smoke test)
        if: runner.os == 'Linux'
        run: cargo build --bin localbar --target ${{ matrix.target }}

      - name: Smoke-test binary starts and exits
        if: runner.os == 'Linux'
        run: |
          timeout 5 ./target/${{ matrix.target }}/debug/localbar --help || true
          echo "binary ran without crash"
