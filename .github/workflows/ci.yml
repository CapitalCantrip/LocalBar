name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: localbar-tauri/ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: localbar-tauri/ui
        run: npm ci

      - name: Build frontend
        working-directory: localbar-tauri/ui
        run: npm run build

      - name: No code comments
        run: |
          scripts/check-no-comments --self-test
          scripts/check-no-comments

      - name: Install uv
        if: runner.os == 'Linux'
        uses: astral-sh/setup-uv@v6

      - name: Install quality-gates
        if: runner.os == 'Linux'
        run: uv tool install "quality-gates @ git+https://github.com/CapitalCantrip/quality-gates@v0.4.0"

      - name: Skills, stage guard and asking rule match the pinned quality-gates
        if: runner.os == 'Linux'
        run: qg-skills --check

      - name: cargo clippy (workspace)
        run: cargo clippy --all-targets --workspace -- -D warnings

      - name: cargo test (workspace)
        run: cargo test --workspace

      - name: TS bindings are up to date
        if: runner.os == 'Linux'
        run: |
          cargo test -p localbar-core -p localbar-tauri --features ts export_bindings
          git diff --exit-code localbar-tauri/ui/src/generated
          test -z "$(git status --porcelain localbar-tauri/ui/src/generated)"

      - name: Build localbar-tauri binary (smoke test)
        if: runner.os == 'Linux'
        run: cargo build --bin localbar-tauri --target ${{ matrix.target }}

      - name: Smoke-test binary starts and exits
        if: runner.os == 'Linux'
        run: |
          timeout 5 ./target/${{ matrix.target }}/debug/localbar-tauri --help || true
          echo "binary ran without crash"
